<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>板金推奨値</title>
<link rel="stylesheet" href="app.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1f5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="板金推奨値">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
</head>
<body>
<header class="bar">
  <button id="back" class="icon" aria-label="戻る" hidden>&#8592;</button>
  <h1 id="title">板金推奨値</h1>
</header>
<main id="lock-view">
  <form id="lock-form" class="panel lock" autocomplete="off">
    <div class="item" style="font-size:17px;font-weight:700">パスワードを入力</div>
    <p class="ctx">共通パスワードを入力してください。この端末では次回から入力不要です。</p>
    <input id="lock-pw" type="password" autocomplete="current-password" enterkeyhint="go" aria-label="パスワード">
    <button id="lock-btn" class="btn primary" type="submit">開く</button>
    <div id="lock-msg" class="lockmsg" role="status"></div>
  </form>
</main>
<main id="search-view" hidden>
  <div class="searchbox">
    <input id="q" type="text" placeholder="副資材・部位・キーワード（空白でAND）" autocomplete="off" enterkeyhint="search">
    <button id="clear" class="icon" aria-label="クリア" hidden>&#215;</button>
  </div>
  <div class="filters">
    <div id="cat-chips" class="chips" role="group" aria-label="区分"></div>
    <div class="selects">
      <select id="cons" aria-label="主材・構法"></select>
      <select id="vtype" aria-label="値種別"></select>
    </div>
  </div>
  <div id="notice" class="notice" hidden></div>
  <div id="count" class="count"></div>
  <ul id="results" class="cards"></ul>
  <section id="page-hits" hidden>
    <h2>原文（OCR）にのみ含まれる箇所</h2>
    <ul id="page-list" class="pagehits"></ul>
  </section>
  <footer id="foot" class="foot"></footer>
</main>
<main id="detail-view" hidden></main>
<main id="page-view" hidden></main>
<div id="toast" class="toast" hidden></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
